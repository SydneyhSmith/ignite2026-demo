# Stands in for the app team's pipeline: builds and pushes the website image.
# The package must be PUBLIC so Container Apps can pull it without credentials.
name: build-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag
        default: v42

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          build-args: APP_VERSION=${{ inputs.version }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/orders-web:${{ inputs.version }}
