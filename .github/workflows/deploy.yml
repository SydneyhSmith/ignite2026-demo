name: Contoso Orders infrastructure

# Entra objects (entra.bicep) are deployed first as a regular deployment, only after approval.
# Their object IDs are passed to the stack through the BLOB_READER_GROUP_ID and ORDERS_API_SP_ID
# environment variables, which prod.bicepparam reads. For pull requests, set the same two values as
# repository variables (copy them from the deploy job summary after the first deploy).
on:
  pull_request:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
      - '**.snapshot.json'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
      - '**.snapshot.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login, no secrets

env:
  # Keep in step with the Bicep version used to generate the committed snapshots.
  BICEP_VERSION: v0.48.1
  STACK_NAME: contoso-orders-prod
  RESOURCE_GROUP: ignite2026
  LOCATION: westus3

jobs:
  validate:
    name: Snapshot validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fails when the committed snapshot no longer matches what the template would deploy.
      # Runs offline with the fixed scope embedded in the snapshot, not the deployment target.
      # Regenerate locally with the same flags and commit the result if the change is intended.
      - name: Validate prod snapshot
        run: >
          bicep snapshot prod.bicepparam --mode validate
          --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          --resource-group "$RESOURCE_GROUP"
          --location "$LOCATION"

  whatif:
    name: Stack what-if (prod)
    # Preview changes even when snapshot validation fails, unless the run is cancelled.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        uses: azure/bicep-deploy@v2
        env:
          BLOB_READER_GROUP_ID: ${{ vars.BLOB_READER_GROUP_ID }}
          ORDERS_API_SP_ID: ${{ vars.ORDERS_API_SP_ID }}
        with:
          type: deploymentStack
          operation: whatIf
          name: ${{ env.STACK_NAME }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          parameters-file: ./prod.bicepparam
          action-on-unmanage-resources: delete
          deny-settings-mode: none

  deploy:
    name: Deploy stack (prod)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate the job.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Entra objects
        id: entra
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: contoso-orders-entra-prod
          scope: resourceGroup
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          parameters-file: ./entra.prod.bicepparam

      - name: Show Entra object IDs
        run: |
          {
            echo "### Entra object IDs"
            echo "Set these as repository variables for PR what-if:"
            echo "- BLOB_READER_GROUP_ID: \`${{ steps.entra.outputs.blobReaderGroupObjectId }}\`"
            echo "- ORDERS_API_SP_ID: \`${{ steps.entra.outputs.ordersApiServicePrincipalObjectId }}\`"
            echo "- orders-api client ID: \`${{ steps.entra.outputs.ordersApiClientId }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create stack
        uses: azure/bicep-deploy@v2
        env:
          BLOB_READER_GROUP_ID: ${{ steps.entra.outputs.blobReaderGroupObjectId }}
          ORDERS_API_SP_ID: ${{ steps.entra.outputs.ordersApiServicePrincipalObjectId }}
        with:
          type: deploymentStack
          operation: create
          name: ${{ env.STACK_NAME }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          parameters-file: ./prod.bicepparam
          action-on-unmanage-resources: delete
          deny-settings-mode: none
