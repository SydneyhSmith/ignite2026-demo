name: Contoso Orders deploy only

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login, no secrets

env:
  STACK_NAME: contoso-orders-prod
  RESOURCE_GROUP: ignite2026

jobs:
  deploy:
    name: Deploy stack (prod)
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate the job.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create stack
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: create
          name: ${{ env.STACK_NAME }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          parameters-file: ./prod.bicepparam
          action-on-unmanage-resources: delete
          deny-settings-mode: none
